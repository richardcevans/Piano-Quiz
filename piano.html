<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Piano</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #1a1a2e;
    font-family: 'Segoe UI', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 24px 20px 40px;
    color: #eee;
  }

  .nav {
    width: 100%;
    max-width: 900px;
    display: flex;
    justify-content: flex-end;
    margin-bottom: 16px;
  }

  .nav a {
    font-size: 0.75rem;
    font-weight: 700;
    color: #6d50b8;
    text-decoration: none;
    letter-spacing: 1px;
    padding: 6px 14px;
    border: 1px solid #2a1f50;
    border-radius: 99px;
    transition: all 0.2s;
  }
  .nav a:hover { color: #a08cff; border-color: #5b3db0; background: #1f1840; }

  h1 {
    font-size: 1.8rem;
    font-weight: 300;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: #a0c4ff;
    margin-bottom: 6px;
  }

  .subtitle {
    font-size: 0.75rem;
    color: #555;
    letter-spacing: 2px;
    margin-bottom: 26px;
  }

  /* ── Controls ── */
  .controls {
    display: flex;
    gap: 16px;
    align-items: flex-end;
    margin-bottom: 24px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .ctrl {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
  }

  .ctrl label {
    font-size: 0.65rem;
    color: #666;
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }

  .ctrl input[type=range] {
    width: 90px;
    accent-color: #a0c4ff;
    cursor: pointer;
  }

  .pill-btn {
    background: #16213e;
    border: 1px solid #2a3a5c;
    color: #888;
    padding: 7px 18px;
    border-radius: 99px;
    cursor: pointer;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 1px;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .pill-btn:hover  { border-color: #a0c4ff; color: #c0d8ff; }
  .pill-btn.active { background: rgba(160,196,255,0.12); border-color: #a0c4ff; color: #a0c4ff; }

  .oct-wrap {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .oct-btn {
    background: #16213e;
    border: 1px solid #2a3a5c;
    color: #888;
    width: 28px; height: 28px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 1rem;
    line-height: 1;
    transition: all 0.2s;
    display: flex; align-items: center; justify-content: center;
  }
  .oct-btn:hover { border-color: #a0c4ff; color: #a0c4ff; }
  #octave-display {
    font-size: 0.8rem; color: #a0c4ff;
    min-width: 52px; text-align: center;
  }

  /* ── Loading state ── */
  #load-status {
    font-size: 0.72rem;
    color: #555;
    letter-spacing: 1px;
    min-height: 1.2em;
    margin-bottom: 10px;
    transition: color 0.3s;
  }
  #load-status.ready { color: #3a7a50; }
  #load-status.error { color: #8a3030; }

  /* ── Note display ── */
  .note-display {
    font-size: 2rem;
    font-weight: 200;
    color: #a0c4ff;
    letter-spacing: 5px;
    min-height: 2.6rem;
    text-align: center;
    margin-bottom: 16px;
  }

  /* ── Piano ── */
  .piano-scroll {
    overflow-x: auto;
    max-width: 100%;
    padding-bottom: 6px;
  }

  .piano-shell {
    background: linear-gradient(180deg, #0a0a18 0%, #141428 100%);
    border: 1px solid #252540;
    border-radius: 14px 14px 0 0;
    padding: 18px 22px 0;
    min-width: max-content;
    position: relative;
  }

  .piano-keys {
    position: relative;
    display: flex;
    gap: 3px;
    min-width: max-content;
  }

  .piano-foot {
    background: linear-gradient(180deg, #141428 0%, #0a0a18 100%);
    height: 18px;
    border: 1px solid #252540;
    border-top: none;
    border-radius: 0 0 14px 14px;
    min-width: max-content;
  }

  /* White keys */
  .wk {
    position: relative;
    width: 50px;
    height: 195px;
    background: linear-gradient(180deg, #f5f5ec 0%, #fefef8 55%, #e6e6de 100%);
    border: 1px solid #bbb;
    border-top: none;
    border-radius: 0 0 7px 7px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    padding-bottom: 10px;
    user-select: none;
    transition: background 0.05s;
    box-shadow: inset 0 -3px 6px rgba(0,0,0,0.12), 2px 4px 5px rgba(0,0,0,0.28);
  }
  .wk:hover { background: linear-gradient(180deg, #eeeee5 0%, #f5f5ee 55%, #dcdcd4 100%); }
  .wk.on {
    background: linear-gradient(180deg, #c4dcf8 0%, #a8ccf0 55%, #8cb8e4 100%) !important;
    box-shadow: inset 0 2px 5px rgba(0,0,0,0.18), 1px 2px 3px rgba(0,0,0,0.25);
    transform: translateY(2px);
  }

  /* Black keys */
  .bk {
    position: absolute;
    width: 32px;
    height: 122px;
    background: linear-gradient(180deg, #0e0e0e 0%, #1c1c1c 35%, #2a2a2a 100%);
    border: 1px solid #080808;
    border-top: none;
    border-radius: 0 0 5px 5px;
    cursor: pointer;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    padding-bottom: 7px;
    user-select: none;
    transition: background 0.05s;
    box-shadow: inset 0 -2px 5px rgba(0,0,0,0.5), 2px 3px 7px rgba(0,0,0,0.65);
  }
  .bk:hover { background: linear-gradient(180deg, #1a1a1a 0%, #282828 35%, #363636 100%); }
  .bk.on {
    background: linear-gradient(180deg, #0d2240 0%, #153560 35%, #1c4880 100%) !important;
    box-shadow: inset 0 1px 4px rgba(0,0,0,0.4), 1px 2px 4px rgba(0,0,0,0.5);
    transform: translateY(2px);
  }

  .key-name {
    font-size: 0.6rem;
    font-weight: 700;
    pointer-events: none;
    letter-spacing: 0.3px;
  }
  .wk .key-name { color: #999; }
  .bk .key-name { color: #666; }

  .show-names .wk .key-name { color: #555; }
  .show-names .bk .key-name { color: #aaa; }

  .key-shortcut {
    font-size: 0.55rem;
    pointer-events: none;
    margin-top: 2px;
    color: #bbb;
    background: rgba(0,0,0,0.07);
    padding: 1px 3px;
    border-radius: 2px;
  }
  .bk .key-shortcut { color: #666; }
  .show-names .bk .key-shortcut { color: #888; }

  /* ── Keyboard guide ── */
  .kbd-guide {
    background: #12182e;
    border: 1px solid #252540;
    border-radius: 10px;
    padding: 14px 22px;
    margin-top: 20px;
    max-width: 580px;
    width: 100%;
  }
  .kbd-guide h3 {
    font-size: 0.65rem; color: #555; letter-spacing: 2px;
    text-transform: uppercase; text-align: center; margin-bottom: 10px;
  }
  .kbd-rows { display: flex; flex-direction: column; gap: 5px; align-items: center; }
  .kbd-row  { display: flex; gap: 3px; align-items: center; }
  .row-lbl  { font-size: 0.6rem; color: #444; width: 54px; text-align: right; padding-right: 7px; }
  .kk {
    background: #1a2240; border: 1px solid #333; border-radius: 4px;
    padding: 3px 7px; font-size: 0.7rem; color: #888;
    min-width: 26px; text-align: center;
  }
  .kk.b  { color: #7090e0; border-color: #2a3a70; }
  .kk.sp { opacity: 0; pointer-events: none; }
  .hint  { font-size: 0.62rem; color: #444; margin-top: 4px; }
  .hint strong { color: #6080b8; }
</style>
</head>
<body>

<nav class="nav">
  <a href="note-quiz.html">&#127925; Note Quiz</a>
</nav>

<h1>Piano</h1>
<p class="subtitle">salamander grand piano</p>

<div class="controls">
  <div class="ctrl">
    <label>Volume</label>
    <input type="range" id="vol" min="0" max="100" value="75">
  </div>
  <div class="ctrl">
    <label>Octave (keys)</label>
    <div class="oct-wrap">
      <button class="oct-btn" id="oct-dn">−</button>
      <span id="octave-display">Oct 4</span>
      <button class="oct-btn" id="oct-up">+</button>
    </div>
  </div>
  <button class="pill-btn active" id="btn-names">Note Names</button>
  <button class="pill-btn" id="btn-sustain">Sustain</button>
</div>

<div id="load-status">Loading samples…</div>
<div class="note-display" id="note-disp"></div>

<div class="piano-scroll">
  <div class="piano-shell">
    <div class="piano-keys show-names" id="piano-keys"></div>
  </div>
  <div class="piano-foot" id="piano-foot"></div>
</div>

<div class="kbd-guide">
  <h3>Keyboard Layout</h3>
  <div class="kbd-rows">
    <div class="kbd-row">
      <span class="row-lbl">White:</span>
      <div class="kk">A</div><div class="kk">S</div><div class="kk">D</div>
      <div class="kk">F</div><div class="kk">G</div><div class="kk">H</div>
      <div class="kk">J</div><div class="kk">K</div><div class="kk">L</div>
      <div class="kk">;</div>
    </div>
    <div class="kbd-row">
      <span class="row-lbl">Black:</span>
      <div class="kk b">W</div><div class="kk b">E</div><div class="kk sp">.</div>
      <div class="kk b">T</div><div class="kk b">Y</div><div class="kk b">U</div>
      <div class="kk sp">.</div><div class="kk b">O</div><div class="kk b">P</div>
    </div>
    <div class="kbd-row">
      <span class="hint">Octave shift: <strong>Z</strong> down &nbsp;/&nbsp; <strong>X</strong> up</span>
    </div>
  </div>
</div>

<script>
// ── Salamander Grand Piano samples ──────────────────────────────────────────
// Run: python -m http.server 8080  (from the Note-Quiz folder)
// Then open: http://localhost:8080/piano.html
const BASE = 'SalamanderGrandPiano/';
const VEL  = 'v8';

// filename → midi of that sample
const SAMPLES = {
  'A4':  { file: `A4${VEL}.wav`,        midi: 69 },
  'C5':  { file: `C5${VEL}.wav`,        midi: 72 },
  'Ds5': { file: `D%235${VEL}.wav`,     midi: 75 },   // D#5, # = %23
  'Fs5': { file: `F%235${VEL}.wav`,     midi: 78 },   // F#5
  'A5':  { file: `A5v6.wav`,            midi: 81 },   // v8 missing, use v6
  'C6':  { file: `C6${VEL}.wav`,        midi: 84 },
  'Ds6': { file: `D%236${VEL}.wav`,     midi: 87 },   // D#6
};

const AudioCtx = window.AudioContext || window.webkitAudioContext;
let ctx = null;
let masterGain = null;
const buffers = {};
let samplesLoaded = false;

function ensureCtx() {
  if (!ctx) {
    ctx = new AudioCtx();
    masterGain = ctx.createGain();
    masterGain.gain.value = 0.75;
    masterGain.connect(ctx.destination);
  }
  if (ctx.state === 'suspended') ctx.resume();
}

async function loadSamples() {
  ensureCtx();
  const statusEl = document.getElementById('load-status');
  try {
    await Promise.all(
      Object.entries(SAMPLES).map(async ([key, { file }]) => {
        const res = await fetch(BASE + file);
        if (!res.ok) throw new Error(`${file} → ${res.status}`);
        const ab = await res.arrayBuffer();
        buffers[key] = await ctx.decodeAudioData(ab);
      })
    );
    samplesLoaded = true;
    statusEl.textContent = 'Grand piano ready';
    statusEl.className = 'ready';
    setTimeout(() => { statusEl.textContent = ''; }, 2000);
  } catch (e) {
    statusEl.textContent = 'Run via local server (python -m http.server 8080) to hear audio';
    statusEl.className = 'error';
  }
}

// Find nearest sample and compute playback rate to reach target midi
function nearestSample(targetMidi) {
  let bestKey = null, bestDist = Infinity;
  for (const [key, { midi }] of Object.entries(SAMPLES)) {
    const d = Math.abs(midi - targetMidi);
    if (d < bestDist) { bestDist = d; bestKey = key; }
  }
  const rate = Math.pow(2, (targetMidi - SAMPLES[bestKey].midi) / 12);
  return { key: bestKey, rate };
}

// Active note voices (for polyphony + release)
const voices = {};

function playMidi(midi) {
  ensureCtx();
  if (!samplesLoaded) return;
  if (voices[midi]) return;

  const { key, rate } = nearestSample(midi);
  const buf = buffers[key];
  if (!buf) return;

  const now = ctx.currentTime;
  const gain = ctx.createGain();
  gain.gain.setValueAtTime(0, now);
  gain.gain.linearRampToValueAtTime(0.9, now + 0.007);
  gain.gain.setValueAtTime(0.9, now + 0.1);
  gain.gain.exponentialRampToValueAtTime(0.001, now + 4.5);
  gain.connect(masterGain);

  const src = ctx.createBufferSource();
  src.buffer = buf;
  src.playbackRate.value = rate;
  src.connect(gain);
  src.start(now);
  src.stop(now + 5.0);

  voices[midi] = { gain, src };
}

function releaseMidi(midi) {
  const v = voices[midi];
  if (!v) return;
  delete voices[midi];

  if (sustainOn) return;

  const now = ctx.currentTime;
  v.gain.gain.cancelScheduledValues(now);
  v.gain.gain.setValueAtTime(v.gain.gain.value, now);
  v.gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
  try { v.src.stop(now + 0.4); } catch(e) {}
}

// ── Piano layout: C3 to C6 ───────────────────────────────────────────────────
const NOTE_NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const IS_BLACK   = [0,1,0,1,0,0,1,0,1,0,1,0];
const START_MIDI = 48; // C3
const END_MIDI   = 84; // C6

const WHITE_SHORTS = ['a','s','d','f','g','h','j','k','l',';'];
const WHITE_OFF    = [0,2,4,5,7,9,11];
const BLACK_MAP    = { w:1, e:3, t:6, y:8, u:10, o:13, p:15 };

const keyElems = {};

function buildPiano() {
  const container = document.getElementById('piano-keys');
  container.innerHTML = '';

  for (let m = START_MIDI; m <= END_MIDI; m++) {
    if (IS_BLACK[m % 12]) continue;
    const nm  = NOTE_NAMES[m % 12];
    const oct = Math.floor(m / 12) - 1;
    const el  = document.createElement('div');
    el.className = 'wk';
    el.dataset.midi = m;
    const nameEl = document.createElement('span');
    nameEl.className = 'key-name';
    nameEl.textContent = nm + (nm === 'C' ? oct : '');
    el.appendChild(nameEl);
    el.addEventListener('mousedown',  ev => { ev.preventDefault(); keyOn(m); });
    el.addEventListener('mouseup',    () => keyOff(m));
    el.addEventListener('mouseleave', () => keyOff(m));
    el.addEventListener('touchstart', ev => { ev.preventDefault(); keyOn(m); }, { passive: false });
    el.addEventListener('touchend',   () => keyOff(m));
    container.appendChild(el);
    keyElems[m] = el;
  }

  const WHITE_W = 53;
  let wi = 0;
  for (let m = START_MIDI; m <= END_MIDI; m++) {
    const noteIdx = m % 12;
    if (!IS_BLACK[noteIdx]) { wi++; continue; }
    const nm  = NOTE_NAMES[noteIdx];
    const oct = Math.floor(m / 12) - 1;
    const el  = document.createElement('div');
    el.className = 'bk';
    el.dataset.midi = m;
    el.style.left = (18 + wi * WHITE_W - 16) + 'px';
    el.style.top  = '18px';
    const nameEl = document.createElement('span');
    nameEl.className = 'key-name';
    nameEl.textContent = nm + oct;
    el.appendChild(nameEl);
    el.addEventListener('mousedown',  ev => { ev.preventDefault(); keyOn(m); });
    el.addEventListener('mouseup',    () => keyOff(m));
    el.addEventListener('mouseleave', () => keyOff(m));
    el.addEventListener('touchstart', ev => { ev.preventDefault(); keyOn(m); }, { passive: false });
    el.addEventListener('touchend',   () => keyOff(m));
    container.appendChild(el);
    keyElems[m] = el;
  }

  setTimeout(() => {
    const shell = document.querySelector('.piano-shell');
    document.getElementById('piano-foot').style.width = shell.scrollWidth + 'px';
  }, 50);
}

buildPiano();

// ── Key on/off ───────────────────────────────────────────────────────────────
const noteDisp = document.getElementById('note-disp');
let noteDispTimer = null;

function keyOn(midi) {
  playMidi(midi);
  const el = keyElems[midi];
  if (el) el.classList.add('on');
  const nm  = NOTE_NAMES[midi % 12];
  const oct = Math.floor(midi / 12) - 1;
  noteDisp.textContent = nm + oct;
  clearTimeout(noteDispTimer);
}

function keyOff(midi) {
  releaseMidi(midi);
  const el = keyElems[midi];
  if (el) el.classList.remove('on');
  noteDispTimer = setTimeout(() => { noteDisp.textContent = ''; }, 1200);
}

// ── Keyboard control ─────────────────────────────────────────────────────────
let kbdOctave = 4;
let sustainOn = false;
const heldKbd = new Set();

function kbdMidi(semitoneFromC) {
  return 12 * (kbdOctave + 1) + semitoneFromC;
}

document.addEventListener('keydown', e => {
  if (e.repeat) return;
  const k = e.key.toLowerCase();
  if (k === 'z') { kbdOctave = Math.max(1, kbdOctave - 1); updateOctDisp(); return; }
  if (k === 'x') { kbdOctave = Math.min(6, kbdOctave + 1); updateOctDisp(); return; }
  const wi = WHITE_SHORTS.indexOf(k);
  if (wi !== -1) {
    const midi = kbdMidi(WHITE_OFF[wi % 7]) + Math.floor(wi / 7) * 12;
    if (!heldKbd.has(midi)) { heldKbd.add(midi); keyOn(midi); }
    return;
  }
  const off = BLACK_MAP[k];
  if (off !== undefined) {
    const midi = kbdMidi(off);
    if (!heldKbd.has(midi)) { heldKbd.add(midi); keyOn(midi); }
  }
});

document.addEventListener('keyup', e => {
  const k = e.key.toLowerCase();
  const wi = WHITE_SHORTS.indexOf(k);
  if (wi !== -1) {
    const midi = kbdMidi(WHITE_OFF[wi % 7]) + Math.floor(wi / 7) * 12;
    heldKbd.delete(midi); keyOff(midi); return;
  }
  const off = BLACK_MAP[k];
  if (off !== undefined) { const midi = kbdMidi(off); heldKbd.delete(midi); keyOff(midi); }
});

// ── Controls ─────────────────────────────────────────────────────────────────
function updateOctDisp() {
  document.getElementById('octave-display').textContent = 'Oct ' + kbdOctave;
}
document.getElementById('oct-dn').addEventListener('click', () => { kbdOctave = Math.max(1, kbdOctave - 1); updateOctDisp(); });
document.getElementById('oct-up').addEventListener('click', () => { kbdOctave = Math.min(6, kbdOctave + 1); updateOctDisp(); });
document.getElementById('vol').addEventListener('input', function() { if (masterGain) masterGain.gain.value = this.value / 100; });

const btnNames = document.getElementById('btn-names');
btnNames.addEventListener('click', () => {
  btnNames.classList.toggle('active');
  document.getElementById('piano-keys').classList.toggle('show-names');
});

const btnSustain = document.getElementById('btn-sustain');
btnSustain.addEventListener('click', () => {
  sustainOn = !sustainOn;
  btnSustain.classList.toggle('active', sustainOn);
});

loadSamples();
</script>
</body>
</html>
